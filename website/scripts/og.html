<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;src:url(../public/fonts/outfit-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:JBM;src:url(../public/fonts/jetbrains-mono-latin.woff2) format('woff2');font-weight:100 900}
html,body{margin:0}
.og{width:1200px;height:630px;background:#FAF8F3;color:#070A0F;font-family:Outfit;box-sizing:border-box;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:500;letter-spacing:-0.01em}
.label{font-family:JBM;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#5C6069;font-weight:500}
h1{margin:0;font-weight:300;font-size:128px;line-height:1;letter-spacing:-0.035em;max-width:10ch}
.rule{width:48px;height:2px;background:#C9A227;margin-bottom:28px}
.bottom{font-size:26px;color:#3A3D44}
</style></head>
<body>
<div class="og">
  <div class="top"><span>Sugan AI</span><span class="label">Somali Language AI Lab</span></div>
  <div><div class="rule"></div><h1>AI that speaks Somali.</h1></div>
  <div class="bottom">A research initiative of AIVERSE Africa.</div>
</div>
</body></html>
